name: Weekly RSI Screen

on:
  schedule:
    # 08:00 UTC Saturday = ~04:00 ET Sat, after Friday's close is fully settled.
    # GitHub's scheduler is best-effort and can lag under load.
    - cron: '0 8 * * 6'
  workflow_dispatch:
    inputs:
      min_mcap:
        description: 'Minimum market cap (USD)'
        default: '50e6'
      trend_weight:
        description: '0 = deep value, 0.5 = balanced, 1 = momentum'
        default: '0.5'
      max_rsi:
        description: 'Hard RSI ceiling (blank = use deciles 1-3)'
        default: ''
      top_n:
        description: 'Picks per sector'
        default: '3'

permissions:
  contents: write

concurrency:
  group: weekly-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # hosted runners hard-stop at 6h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Sector/industry and share counts are static, so this cache is what keeps
      # later runs fast. It is committed back at the end of the job.
      - name: Restore fetch cache
        uses: actions/cache@v4
        with:
          path: cache
          key: weekly-${{ github.run_id }}
          restore-keys: weekly-

      - name: Drop stale price checkpoints
        # Older than 3 days = a previous week's prices. The sector cache lives in
        # data/ and is deliberately untouched.
        run: find cache -name '*.pkl' -mtime +3 -delete 2>/dev/null || true

      - name: Build universe
        run: python build_universe.py --out data/us_universe.csv --exclude funds spacs debt

      - name: Run screener
        env:
          MIN_MCAP: ${{ inputs.min_mcap || '50e6' }}
        run: |
          python screener.py \
            --universe data/us_universe.csv \
            --min-mcap "$MIN_MCAP" \
            --source yahoo \
            --max-runtime-min 240

      - name: Fill any missing company names
        run: python patch_enrichment.py --csv output/rsi_ranked_all.csv --names-only || true

      - name: Rank opportunities by sector
        env:
          TW: ${{ inputs.trend_weight || '0.5' }}
          TOPN: ${{ inputs.top_n || '3' }}
          MAXRSI: ${{ inputs.max_rsi }}
        run: |
          ARGS="--csv output/rsi_ranked_all.csv --outdir output --trend-weight $TW --top-n $TOPN"
          if [ -n "$MAXRSI" ]; then ARGS="$ARGS --max-rsi $MAXRSI"; fi
          python rank_opportunities.py $ARGS

      - name: Archive dated copy
        run: |
          D=$(date -u +%Y-%m-%d)
          mkdir -p history
          cp output/rsi_ranked_all.csv "history/rsi_ranked_all_$D.csv"
          cp output/top_by_sector.csv  "history/top_by_sector_$D.csv"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-screen-${{ github.run_number }}
          path: |
            output/
            history/
          retention-days: 90

      - name: Commit results
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ history/ data/sector_cache.csv data/us_universe.csv
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Weekly RSI screen $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          if [ -f output/run_summary.json ]; then
            echo '<details><summary>Run details</summary>' >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat output/run_summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '</details>' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f output/top_summary.md ]; then
            cat output/top_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo 'Run failed before ranking.' >> $GITHUB_STEP_SUMMARY
          fi
